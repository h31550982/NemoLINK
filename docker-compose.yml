##########################
# NEMOLink — local UI/UX study stack
#
#   docker compose up -d                          # everything, UI on http://localhost:3960
#   docker compose up -d nemolink-db nemolink-worker nemo-mock
#                                                 # only the backing services, then run
#                                                 # server/ and app/ with `npm run dev`
#
# Everything binds to 127.0.0.1. NEMO is a local mock (Prism): nothing here
# can reach the real or the staging NEMO.
##########################
name: nemolink
services:
  # PostgreSQL. First boot on an empty volume initialises from schema.sql;
  # later changes arrive as migrations, applied by the server/worker at boot.
  nemolink-db:
    image: postgres:18-bookworm
    container_name: nemolink-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nemolink}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nemolink-dev}
      - POSTGRES_DB=${POSTGRES_DB:-nemolink}
      - TZ=UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - nemolink-db-data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemolink} -d ${POSTGRES_DB:-nemolink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local NEMO mock: answers generated from vendor/nemo/openapi/declarant.json.
  nemo-mock:
    build:
      context: ./tools/nemo-mock
    container_name: nemo-mock
    volumes:
      - ./vendor/nemo/openapi:/openapi:ro
    ports:
      - "127.0.0.1:4010:4010"

  # Worker: fills the reference data on boot (codelists and HS map from
  # vendor/, locations from Fintraffic's public NEMO hub, ships from
  # Digitraffic's public port-call feed), then weekly/daily.
  nemolink-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nemolink-worker
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nemolink}:${POSTGRES_PASSWORD:-nemolink-dev}@nemolink-db:5432/${POSTGRES_DB:-nemolink}
      - NEMO_MOCK_URL=http://nemo-mock:4010
      - REFDATA_DIR=/app/vendor
      - REFDATA_SYNC_ON_BOOT=true
    volumes:
      - ./vendor:/app/vendor:ro
    depends_on:
      nemolink-db:
        condition: service_healthy

  # API (production build). For hot reload run `npm run dev` in server/ instead.
  nemolink-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nemolink-server
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nemolink}:${POSTGRES_PASSWORD:-nemolink-dev}@nemolink-db:5432/${POSTGRES_DB:-nemolink}
      - NEMO_MOCK_URL=http://nemo-mock:4010
      - REFDATA_DIR=/app/vendor
      - SCHEMA_SQL_PATH=/app/schema.sql
      - PUBLIC_BASE_URL=http://localhost:3960
    volumes:
      - ./schema.sql:/app/schema.sql:ro
      - ./vendor:/app/vendor:ro
    ports:
      - "127.0.0.1:3000:3000"
    # Healthy once migrations have run and the API answers.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      nemolink-db:
        condition: service_healthy

  # One-shot: a demo organisation and logins, created on the first run
  # (later runs find them and change nothing).
  #   admin@demo.example   / demo-password-123   (organisation admin)
  #   platform@demo.example / demo-password-123  (platform admin, sees all orgs)
  nemolink-seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nemolink-seed
    entrypoint: ["sh", "-c"]
    command:
      - >
        node dist/scripts/provision-org.js demo "Demo Shipping Oy" --business-id 1234567-1 || true;
        echo demo-password-123 | node dist/scripts/create-user.js demo admin@demo.example --role admin --type local --password-stdin || true;
        echo demo-password-123 | node dist/scripts/create-user.js demo platform@demo.example --role superadmin --type local --password-stdin || true
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nemolink}:${POSTGRES_PASSWORD:-nemolink-dev}@nemolink-db:5432/${POSTGRES_DB:-nemolink}
      - REFDATA_DIR=/app/vendor
      - SCHEMA_SQL_PATH=/app/schema.sql
    volumes:
      - ./schema.sql:/app/schema.sql:ro
      - ./vendor:/app/vendor:ro
    depends_on:
      nemolink-server:
        condition: service_healthy
    restart: "no"

  # UI (production build, nginx; proxies /api to nemolink-server).
  # For hot reload run `npm run dev` in app/ instead (http://localhost:9000).
  nemolink-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nemolink-app
    ports:
      - "127.0.0.1:3960:80"
    depends_on:
      - nemolink-server

volumes:
  nemolink-db-data:

# nemolink-app nginx — serves the built SPA and proxies /api to the server
# container (local compose stack).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://nemolink-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vue Router history mode — unknown paths fall back to the SPA shell.
    # The shell is revalidated on every load, so a rebuild shows at once
    # (the hashed assets above stay cached forever)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
